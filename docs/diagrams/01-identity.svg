<rect width="1800" height="1180" fill="white"/>
<text x="40" y="53.333333333333336" font-family="Arial,sans-serif" font-size="28" fill="#163449">BionicPRO: вход и локальное хранение данных</text>
<text x="40" y="91.66666666666667" font-family="Arial,sans-serif" font-size="17" fill="#506574">C4, целевая архитектура. Отдельное развертывание в каждой стране; общий протокол входа для приложений.</text>
<rect x="40" y="140" width="220" height="110" rx="10" fill="#124970"/>
<text x="150.0" y="177.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="white">Пилот протеза</text>
