<text x="505.0" y="223.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="white">Только cookie с ID сессии</text>
<text x="800" y="169.0" font-family="Arial,sans-serif" font-size="18" fill="#506574">Пользователь входит по адресу своего представительства.</text>
<text x="800" y="213.66666666666666" font-family="Arial,sans-serif" font-size="17" fill="#506574">Страна учетной записи определяется по договору до входа.</text>
