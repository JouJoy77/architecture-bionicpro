name: bionicpro

x-auth: &auth
  OIDC_ISSUER: ${OIDC_ISSUER:?Run bash scripts/setup.sh}
  OIDC_INTERNAL_URL: http://keycloak:8080/realms/reports-realm

x-airflow: &airflow
  build:
    context: .
    dockerfile: airflow/Dockerfile
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:demo_airflow@airflow-db/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__PARALLELISM: '2'
    AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__WEBSERVER__WORKERS: '1'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'false'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__SCHEDULER__CREATE_CRON_DATA_INTERVALS: 'true'
    ETL_START_DATE: ${ETL_START_DATE}
    REGION: RU
    CRM_DSN: postgresql://crm_reader:demo_crm_reader@crm-db/crm
    TELEMETRY_DSN: postgresql://telemetry_reader:demo_telemetry_reader@telemetry-db/telemetry
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_USER: etl
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ETL_PASSWORD}
  volumes:
    - airflow-logs:/opt/airflow/logs
  depends_on:
    airflow-db:
      condition: service_healthy
    clickhouse:
      condition: service_healthy
    seed:
      condition: service_completed_successfully

services:
  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: demo_keycloak
    volumes:
      - keycloak-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U keycloak -d keycloak']
      interval: 5s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.7
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: demo_admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: demo_keycloak
      KC_HOSTNAME: http://localhost:8081
      KC_HEALTH_ENABLED: 'true'
      BFF_CLIENT_SECRET: ${BFF_CLIENT_SECRET}
    command: [start-dev, --import-realm]
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports: ['127.0.0.1:8081:8080']
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; grep -q UP <&3'"]
      interval: 10s
      start_period: 60s
      retries: 30

  redis:
    image: redis:7.2-alpine
    command: [redis-server, --save, '', --appendonly, 'no', --maxmemory, 128mb, --maxmemory-policy, noeviction]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 20

  crm-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm_admin
      POSTGRES_PASSWORD: demo_crm
    volumes:
      - crm-data:/var/lib/postgresql/data
      - ./infra/crm:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U crm_admin -d crm']
      interval: 5s
      retries: 30

  telemetry-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry_admin
      POSTGRES_PASSWORD: demo_telemetry
    volumes:
      - telemetry-data:/var/lib/postgresql/data
      - ./infra/telemetry:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U telemetry_admin -d telemetry']
      interval: 5s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:25.3-alpine
    environment:
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
      CLICKHOUSE_ETL_PASSWORD: ${CLICKHOUSE_ETL_PASSWORD}
      CLICKHOUSE_REPORT_PASSWORD: ${CLICKHOUSE_REPORT_PASSWORD}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infra/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- http://127.0.0.1:8123/ping | grep -q Ok']
      interval: 5s
      start_period: 30s
      retries: 30
    ulimits:
      nofile: {soft: 262144, hard: 262144}

  seed:
    build:
      context: .
      dockerfile: scripts/Dockerfile.seed
    environment:
      CRM_ADMIN_DSN: postgresql://crm_admin:demo_crm@crm-db/crm
      TELEMETRY_ADMIN_DSN: postgresql://telemetry_admin:demo_telemetry@telemetry-db/telemetry
      OIDC_ISSUER: ${OIDC_ISSUER}
      ETL_START_DATE: ${ETL_START_DATE}
    depends_on:
      crm-db:
        condition: service_healthy
      telemetry-db:
        condition: service_healthy

  airflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: demo_airflow
    volumes:
      - airflow-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U airflow -d airflow']
      interval: 5s
      retries: 30

  airflow-init:
    <<: *airflow
    command:
      - bash
      - -c
      - >-
        airflow db migrate &&
        (airflow users list -o json | python -c 'import sys,json; sys.exit(0 if any(u["username"] == "admin" for u in json.load(sys.stdin)) else 1)' ||
        airflow users create --username admin --password demo_airflow --firstname Demo --lastname Admin --role Admin --email admin@example.com)

  airflow-web:
    <<: *airflow
    command: webserver
    ports: ['127.0.0.1:8082:8080']
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8080/health]
      interval: 15s
      start_period: 45s
      retries: 20

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8974/health]
      interval: 15s
      start_period: 45s
      retries: 20

  reports:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: [uvicorn, reports_service.main:app, --host, 0.0.0.0, --port, '8000', --no-access-log]
    environment:
      <<: *auth
      REGION: RU
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: reports
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_REPORT_PASSWORD}
    depends_on:
      clickhouse:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: [uvicorn, api.main:app, --host, 0.0.0.0, --port, '8000', --no-access-log]
    environment:
      <<: *auth
      PUBLIC_URL: ${PUBLIC_URL}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      BFF_CLIENT_SECRET: ${BFF_CLIENT_SECRET}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY}
      REDIS_URL: redis://redis:6379/0
      REPORTS_URL: http://reports:8000
    depends_on:
      redis:
        condition: service_healthy
      reports:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 20

  frontend:
    build: ./frontend
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      api:
        condition: service_healthy

volumes:
  keycloak-data:
  crm-data:
  telemetry-data:
  clickhouse-data:
  airflow-data:
  airflow-logs:
